plugins { id 'com.android.application' }

android {
    namespace 'com.tuniswatch.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.tuniswatch.app'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
